.s .dn { fill: var(--new); stroke: var(--surface); stroke-width: 2; }
.s .do { fill: var(--old); stroke: var(--surface); stroke-width: 2; }
.s .bn { fill: var(--new); } .s .bo { fill: var(--old); }
