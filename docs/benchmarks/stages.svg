<svg xmlns="http://www.w3.org/2000/svg" class="s" viewBox="0 0 900 540" width="900" height="540" style="max-width:100%;height:auto" role="img" aria-label="Where the time goes per frame">

<style>
.s { --surface:#ffffff; --ink:#1f2328; --ink2:#59636e; --grid:#d8dee4;
     --new:#0969da; --old:#8c959f; --on-old:#1f2328; }
@media (prefers-color-scheme: dark) {
  .s { --surface:#0d1117; --ink:#f0f6fc; --ink2:#9198a1; --grid:#262c36;
       --new:#4493f8; --old:#656c76; --on-old:#ffffff; }
}
.s text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; fill: var(--ink2); font-size: 12px; }
.s .t { fill: var(--ink); font-size: 16px; font-weight: 600; }
.s .lab { fill: var(--ink); font-size: 12px; }
.s .big { fill: var(--ink); font-size: 13px; font-weight: 600; }
.s .in { fill: var(--on-old); }
.s .g { stroke: var(--grid); stroke-width: 1; }
.s .ln { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.s .new { stroke: var(--new); } .s .old { stroke: var(--old); }
.s .dn { fill: var(--new); stroke: var(--surface); stroke-width: 2; }
.s .do { fill: var(--old); stroke: var(--surface); stroke-width: 2; }
.s .bn { fill: var(--new); } .s .bo { fill: var(--old); }
</style>

<text class="t" x="20" y="28">Where the time goes, per tracked frame</text>
<text x="20" y="48">IMG_4122.mp4 1080×1920 · template ~155 px · search ~180 px · time on the UI thread (log scale)</text>
<rect x="20" y="62" width="14" height="4" rx="2" class="bo"/><text x="40" y="68">Original Tracker 6.3.5</text>
<rect x="230" y="62" width="14" height="4" rx="2" class="bn"/><text x="250" y="68">This build (Fast ticked)</text>
<line class="g" x1="190.0" x2="190.0" y1="86" y2="472"/>
<text x="190.0" y="488" text-anchor="middle">0.01 ms</text>
<line class="g" x1="326.0" x2="326.0" y1="86" y2="472"/>
<text x="326.0" y="488" text-anchor="middle">0.1 ms</text>
<line class="g" x1="462.0" x2="462.0" y1="86" y2="472"/>
<text x="462.0" y="488" text-anchor="middle">1 ms</text>
<line class="g" x1="598.0" x2="598.0" y1="86" y2="472"/>
<text x="598.0" y="488" text-anchor="middle">10 ms</text>
<line class="g" x1="734.0" x2="734.0" y1="86" y2="472"/>
<text x="734.0" y="488" text-anchor="middle">100 ms</text>
<line class="g" x1="870.0" x2="870.0" y1="86" y2="472"/>
<text x="870.0" y="488" text-anchor="middle">1 s</text>
<text class="lab" x="178" y="114" text-anchor="end">Find the match</text>
<rect class="bo" x="190" y="96" width="673.5" height="16" rx="4"><title>Java loop over every position: 896 ms</title></rect>
<text x="198" y="108.5" class="in">896 ms · Java loop over every position</text>
<rect class="bn" x="190" y="122" width="312.9" height="16" rx="4"><title>Rust AVX2 / FFT, all cores, run ahead: 2.0 ms</title></rect>
<text x="510.9" y="134.5">2.0 ms · Rust AVX2 / FFT, all cores, run ahead</text>
<text class="lab" x="178" y="178" text-anchor="end">Sub-pixel position</text>
<rect class="bo" x="190" y="160" width="200.9" height="16" rx="4"><title>3-point parabola: 0.30 ms</title></rect>
<text x="398.9" y="172.5">0.30 ms · 3-point parabola</text>
<text x="192.0" y="198.5">≈0 · Gauss-Newton, more accurate: 0.8 ms on the background thread</text>
<text class="lab" x="178" y="242" text-anchor="end">Decode video frame</text>
<rect class="bo" x="190" y="224" width="392.6" height="16" rx="4"><title>FFmpeg, 1 thread, on the UI thread: 7.7 ms</title></rect>
<text x="198" y="236.5" class="in">7.7 ms · FFmpeg, 1 thread, on the UI thread</text>
<rect class="bn" x="190" y="250" width="81.9" height="16" rx="4"><title>8-thread decoder running ahead: 0.04 ms</title></rect>
<text x="279.9" y="262.5">0.04 ms · 8-thread decoder running ahead</text>
<text class="lab" x="178" y="306" text-anchor="end">Copy frame for display</text>
<rect class="bo" x="190" y="288" width="312.9" height="16" rx="4"><title>per-pixel BGR to RGB copy: 2.0 ms</title></rect>
<text x="510.9" y="300.5">2.0 ms · per-pixel BGR to RGB copy</text>
<text x="192.0" y="326.5">0 (skipped) · decoded image reused, no copy</text>
<text class="lab" x="178" y="370" text-anchor="end">Redraw screen + panels</text>
<rect class="bo" x="190" y="352" width="376.8" height="16" rx="4"><title>every frame: 5.9 ms</title></rect>
<text x="574.8" y="364.5">5.9 ms · every frame</text>
<rect class="bn" x="190" y="378" width="277.6" height="16" rx="4"><title>about 25 times a second: 1.1 ms</title></rect>
<text x="475.6" y="390.5">1.1 ms · about 25 times a second</text>
<text class="lab" x="178" y="434" text-anchor="end">Wait for video speed</text>
<rect class="bo" x="190" y="416" width="492.3" height="16" rx="4"><title>up to 42 ms: sleeps to 24 fps if faster (Fast off): 42 ms</title></rect>
<text x="198" y="428.5" class="in">42 ms · up to 42 ms: sleeps to 24 fps if faster (Fast off)</text>
<text x="192.0" y="454.5">0 (skipped) · no wait</text>
<text class="big" x="20" y="526">Whole frame: original ≈ 931 ms (1 fps) → this build ≈ 4.7–5.4 ms (185–213 fps)</text>
